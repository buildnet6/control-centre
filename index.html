<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2D4686">
<meta name="robots" content="noindex,nofollow">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Control Centre">
<title>Prof Newrock Control Centre</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;600;700&family=Public+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: a drawing-issue register. Sticky header + view rail, card grid of "sheets", detail drawer that slides in. */
:root{
  --bg:#F3F4F7; --surface:#FFFFFF; --sunk:#E9EBF1; --line:#D5D9E3; --fg:#1B2030; --muted:#5E6577;
  --indigo:#2D4686; --indigo-soft:#E2E7F4; --laterite:#A9502A; --laterite-soft:#F6E6DD;
  --good:#2F7A4F; --good-soft:#DFF0E5; --warn:#9A6A08; --warn-soft:#F7EDD2; --bad:#B03A3A; --bad-soft:#F6DEDE;
  --f-display:"Familjen Grotesk","Helvetica Neue",Arial,sans-serif;
  --f-body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#11141B; --surface:#1A1E28; --sunk:#232836; --line:#313849; --fg:#E7E9F0; --muted:#9AA1B4;
  --indigo:#8EA6E8; --indigo-soft:#253150; --laterite:#E08A62; --laterite-soft:#3B2820;
  --good:#6CC892; --good-soft:#1F3428; --warn:#E3B349; --warn-soft:#3A3019; --bad:#EE8080; --bad-soft:#3E2224;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11141B; --surface:#1A1E28; --sunk:#232836; --line:#313849; --fg:#E7E9F0; --muted:#9AA1B4;
  --indigo:#8EA6E8; --indigo-soft:#253150; --laterite:#E08A62; --laterite-soft:#3B2820;
  --good:#6CC892; --good-soft:#1F3428; --warn:#E3B349; --warn-soft:#3A3019; --bad:#EE8080; --bad-soft:#3E2224;
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:15px/1.5 var(--f-body);margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--indigo);outline-offset:2px}
.wrap{max-width:1240px;margin:0 auto;padding-inline:16px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:12px;padding-block:12px;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;min-width:0;flex:1}
.brand small{font:600 11px/1 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.brand h1{font:700 22px/1.15 var(--f-display);margin:4px 0 0;text-wrap:balance}
.tabs{display:flex;gap:4px;background:var(--sunk);padding:4px;border-radius:999px}
.tabs button{border:0;background:transparent;padding:7px 12px;border-radius:999px;font-weight:600;font-size:14px;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-block:16px}
.stat{background:var(--surface);padding:12px 14px;display:flex;flex-direction:column;gap:2px;border:0;text-align:left}
button.stat:hover{background:var(--sunk)}
.stat b{font:700 26px/1 var(--f-display);font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted);letter-spacing:.02em}
.stat.alert b{color:var(--bad)}
.rail{display:flex;gap:6px;overflow-x:auto;padding-bottom:10px;scrollbar-width:thin}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:500;display:flex;gap:6px;align-items:center;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.chip i{font-style:normal;font:600 11px var(--f-mono);opacity:.7}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-block:6px 16px}
.tools input,.tools select{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 12px;min-width:0}
.tools input{flex:1 1 220px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 14px;font-weight:600;font-size:14px}
.btn.primary{background:var(--indigo);border-color:var(--indigo);color:var(--surface)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr));gap:12px;padding-bottom:96px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px;text-align:left;min-width:0;width:100%}
.card:hover{border-color:var(--muted)}
.card .head{display:flex;gap:10px;align-items:flex-start}
.pid{font:600 12px/1 var(--f-mono);color:var(--muted);padding-top:4px;flex:none}
.card h3{font:600 17px/1.25 var(--f-display);margin:0;flex:1;min-width:0;text-wrap:balance}
.pill{flex:none;font:600 11px/1 var(--f-mono);padding:5px 7px;border-radius:5px;letter-spacing:.04em}
.pill.P1{background:var(--laterite);color:var(--surface)}
.pill.P2{background:var(--indigo-soft);color:var(--indigo)}
.pill.P3,.pill.P4{background:var(--sunk);color:var(--muted)}
.pill.PX{background:var(--bad-soft);color:var(--bad)}
.metrics{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.scale{display:flex;align-items:center;gap:6px}
.segs{display:grid;grid-template-columns:repeat(8,10px);gap:2px}
.segs s{height:10px;border-radius:2px;background:var(--sunk);text-decoration:none}
.segs s.on{background:var(--indigo)}
.segs s.part{background:repeating-linear-gradient(135deg,var(--indigo) 0 2px,transparent 2px 4px);outline:1px solid var(--indigo);outline-offset:-1px}
.scale em{font:600 12px var(--f-mono);font-style:normal;color:var(--muted)}
.coins{display:flex;gap:3px;align-items:center}
.coins s{width:9px;height:9px;border-radius:50%;background:var(--sunk);text-decoration:none}
.coins s.on{background:var(--laterite)}
.coins b{font:600 11px var(--f-mono);color:var(--laterite)}
.what{margin:-4px 0 0;font-size:13px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.traj{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.traj div{background:var(--bg);padding:10px 12px;font-size:14px}
.traj b{display:block;font:600 11px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--indigo);margin-bottom:3px}
.chain{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
.chain .arrow{color:var(--muted);font-family:var(--f-mono)}
.conn{padding:12px 0;border-bottom:1px solid var(--line)}
.conn:last-child{border-bottom:0}
.conn p{margin:0;font-size:14px;color:var(--muted);max-width:70ch}
@media (max-width:560px){.traj{grid-template-columns:1fr}}
.next{font-size:14px;color:var(--fg);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin:0}
.next::before{content:"Next ";font:600 11px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:12px;padding:3px 8px;border-radius:999px;background:var(--sunk);color:var(--muted)}
.tag.good{background:var(--good-soft);color:var(--good)}
.tag.warn{background:var(--warn-soft);color:var(--warn)}
.tag.bad{background:var(--bad-soft);color:var(--bad)}
.tag.week{background:var(--indigo-soft);color:var(--indigo);font-weight:600}
.score{margin-left:auto;font:600 12px var(--f-mono);color:var(--muted)}
.empty{grid-column:1/-1;border:1px dashed var(--line);border-radius:var(--r);padding:32px;text-align:center;color:var(--muted)}
.empty h2{font:600 20px var(--f-display);color:var(--fg);margin:0 0 6px}
.note{background:var(--warn-soft);color:var(--warn);border-radius:8px;padding:10px 14px;font-size:14px;margin-bottom:12px}
/* drawer */
.scrim{position:fixed;inset:0;background:rgba(10,12,18,.45);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(100%,600px);background:var(--surface);z-index:41;display:flex;flex-direction:column;border-left:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.dhead{display:flex;gap:10px;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line)}
.dhead h2{font:700 19px/1.2 var(--f-display);margin:0;flex:1;min-width:0}
.dbody{overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:18px;flex:1}
.dfoot{display:flex;gap:8px;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);flex-wrap:wrap}
.dfoot .grow{flex:1}
.quick{display:flex;gap:8px;flex-wrap:wrap}
.fs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.fs .full{grid-column:1/-1}
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f label{font:600 11px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.f input,.f select,.f textarea{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 10px;width:100%;min-width:0}
.f textarea{resize:vertical;min-height:64px;line-height:1.45}
.sect{font:600 13px var(--f-display);letter-spacing:.06em;text-transform:uppercase;color:var(--indigo);border-bottom:1px solid var(--line);padding-bottom:6px;margin:0}
.breakdown{display:grid;grid-template-columns:1fr auto;gap:4px 16px;font-size:13px;background:var(--bg);border-radius:8px;padding:12px;font-variant-numeric:tabular-nums}
.breakdown b{font-family:var(--f-mono)}
.breakdown .tot{border-top:1px solid var(--line);padding-top:6px;font-weight:600}
/* week + review */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px}
.panel h2{font:700 20px var(--f-display);margin:0 0 4px}
.panel p.sub{color:var(--muted);margin:0 0 14px;font-size:14px;max-width:65ch}
.five{display:flex;flex-direction:column;gap:8px;counter-reset:o}
.out{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.out .n{font:700 20px var(--f-display);color:var(--indigo);width:22px}
.out input{border:0;background:transparent;width:100%;padding:4px 0;border-bottom:1px dashed var(--line);border-radius:0}
.out small{display:block;color:var(--muted);font-size:12px}
.layers{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px}
.layer{border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:13px}
.layer b{display:block;font:600 14px var(--f-display)}
.layer.over{border-color:var(--bad);background:var(--bad-soft)}
.qs{display:flex;flex-direction:column;gap:14px}
.weekpick{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.ref{width:100%;border-collapse:collapse;font-size:14px}
.ref td,.ref th{border-bottom:1px solid var(--line);padding:8px 6px;text-align:left;vertical-align:top}
.ref th{font:600 11px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.ref td:first-child{font-family:var(--f-mono);white-space:nowrap}
.tablewrap{overflow-x:auto}
.qa{display:flex;flex-direction:column;gap:18px}
.qblock h3{font:600 15px/1.35 var(--f-display);margin:0 0 6px}
.qblock ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px}
.qblock li{padding:7px 10px 7px 12px;border-left:3px solid var(--line);background:var(--bg);border-radius:0 6px 6px 0;font-size:14px}
.qblock li.good{border-left-color:var(--good)}
.qblock li.warn{border-left-color:var(--warn)}
.qblock li.bad{border-left-color:var(--bad)}
button.link{border:0;background:none;padding:0;text-align:left;color:inherit;font:inherit;width:100%}
button.link:hover{color:var(--indigo)}
.day{margin-bottom:12px}
.day h4{font:600 11px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 6px}
.logrow{display:grid;grid-template-columns:auto auto 1fr;gap:10px;align-items:baseline;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:none;padding:8px 2px;font-size:14px}
.logrow:hover{background:var(--bg)}
.lt{font:500 12px var(--f-mono);color:var(--muted);font-variant-numeric:tabular-nums}
.lk{font:600 11px var(--f-mono);padding:3px 6px;border-radius:4px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.k-maturity_up,.k-outcome_done,.k-milestone,.k-created{background:var(--good-soft);color:var(--good)}
.k-revenue{background:var(--laterite-soft);color:var(--laterite)}
.k-maturity_down,.k-archived{background:var(--bad-soft);color:var(--bad)}
.k-week_in,.k-outcome_set{background:var(--indigo-soft);color:var(--indigo)}
.ln{min-width:0;overflow-wrap:anywhere}
.tick{display:flex;align-items:center;gap:6px;cursor:pointer}
.tick input{width:20px;height:20px;accent-color:var(--good)}
.out.done .n{color:var(--good)}
.out.done input[data-wo]{text-decoration:line-through;color:var(--muted)}
@media (max-width:560px){.logrow{grid-template-columns:auto 1fr}.logrow .lt{grid-row:span 2}}
.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:30;display:flex;align-items:center;gap:8px;border:0;border-radius:999px;padding:13px 18px;background:var(--laterite);color:var(--surface);font:600 15px var(--f-display);box-shadow:0 6px 18px rgba(0,0,0,.22)}
.fab svg,.btn svg{width:18px;height:18px;flex:none}
.btn.withicon{display:inline-flex;align-items:center;gap:6px}
.upd .hint{display:flex;gap:10px;align-items:flex-start;background:var(--indigo-soft);color:var(--indigo);border-radius:8px;padding:10px 12px;font-size:14px}
.upd textarea#updText{min-height:180px;font-size:16px}
.shots{display:flex;gap:8px;flex-wrap:wrap}
.shot{position:relative;width:76px;height:76px;border-radius:8px;overflow:hidden;border:1px solid var(--line);background:var(--sunk)}
.shot img{width:100%;height:100%;object-fit:cover}
.shot button{position:absolute;top:2px;right:2px;border:0;border-radius:50%;width:22px;height:22px;background:rgba(0,0,0,.6);color:#fff;font-size:13px;line-height:1}
.filebtn{display:inline-flex;align-items:center;gap:6px;border:1px dashed var(--muted);border-radius:8px;padding:9px 14px;font-weight:600;font-size:14px;cursor:pointer}
.filebtn input{position:absolute;width:1px;height:1px;opacity:0}
.thinking{display:flex;gap:10px;align-items:center;padding:16px;background:var(--bg);border-radius:8px;color:var(--muted)}
.dots{display:inline-flex;gap:4px}.dots i{width:7px;height:7px;border-radius:50%;background:var(--indigo);opacity:.3}
@media (prefers-reduced-motion:no-preference){.dots i{animation:pulse 1.2s infinite}.dots i:nth-child(2){animation-delay:.2s}.dots i:nth-child(3){animation-delay:.4s}@keyframes pulse{50%{opacity:1}}}
.prop{border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:10px;background:var(--bg)}
.prop .phead{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.prop .phead select{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px}
.chg{display:grid;grid-template-columns:auto 1fr;gap:8px 10px;align-items:start;padding-top:8px;border-top:1px solid var(--line)}
.chg input[type=checkbox]{width:18px;height:18px;margin-top:3px;accent-color:var(--good)}
.chg .cl{font:600 11px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.chg .was{font-size:13px;color:var(--muted);text-decoration:line-through;overflow-wrap:anywhere}
.chg .why{font-size:12px;color:var(--good)}
.chg .cv{display:flex;flex-direction:column;gap:4px;min-width:0}
.chg .cv input,.chg .cv select,.chg .cv textarea{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:7px 8px;width:100%}
.chg.off .cv{opacity:.45}
.hist{display:flex;flex-direction:column;gap:10px}
.hent{border-left:3px solid var(--indigo);padding:4px 0 4px 10px;font-size:14px}
.hent small{display:block;font:500 11px var(--f-mono);color:var(--muted);margin-bottom:2px}
.hent .shots{margin-top:6px}.hent .shot{width:60px;height:60px}
.k-update{background:var(--indigo-soft);color:var(--indigo)}
.msline{margin:-4px 0 0;font-size:13px;display:flex;gap:8px;align-items:baseline;color:var(--fg)}
.msline span{flex:none;font:600 11px var(--f-mono);padding:2px 6px;border-radius:4px;background:var(--sunk);color:var(--muted)}
.msline.warn span{background:var(--warn-soft);color:var(--warn)}
.msline.bad span{background:var(--bad-soft);color:var(--bad)}
.why-line{margin:0;font-size:14px;background:var(--indigo-soft);color:var(--fg);border-radius:8px;padding:10px 12px}
.msed{display:flex;flex-direction:column;gap:6px}
.msrow{display:grid;grid-template-columns:auto 1fr 150px auto;gap:8px;align-items:center}
.msrow input[type=checkbox]{width:18px;height:18px;accent-color:var(--good)}
.msrow input[data-mt],.msrow input[data-mu]{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px;min-width:0;width:100%}
.msrow.done input[data-mt]{text-decoration:line-through;color:var(--muted)}
.msx{border:0;background:none;color:var(--muted);font-size:18px;padding:4px 6px}
@media (max-width:560px){.msrow{grid-template-columns:auto 1fr auto}.msrow input[data-mu]{grid-column:2/3}}
.hero{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-block:16px 14px}
.hero small{font:600 11px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.hero h2{font:700 24px/1.2 var(--f-display);margin:6px 0 8px;text-wrap:balance}
.hero p{margin:0;max-width:68ch;font-size:15px}
.pulse{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin-top:14px}
.pulse button{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:10px;text-align:left;display:flex;flex-direction:column;gap:2px}
.pulse b{font:700 22px/1 var(--f-display);font-variant-numeric:tabular-nums}
.pulse span{font-size:12px;color:var(--muted)}
.pulse .bad b{color:var(--bad)}.pulse .warn b{color:var(--warn)}.pulse .good b{color:var(--good)}
.nlist{display:flex;flex-direction:column;gap:6px}
.nitem{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-left-width:4px;border-radius:8px;background:var(--bg)}
.nitem.bad{border-left-color:var(--bad)}.nitem.warn{border-left-color:var(--warn)}.nitem.good{border-left-color:var(--good)}.nitem.info{border-left-color:var(--indigo)}
.nitem button.link b{display:block;font-weight:600}
.nitem button.link small{display:block;color:var(--muted);font-size:13px}
.nitem .btn{padding:6px 10px;font-size:13px}
.month{margin-bottom:18px}
.month h3{font:700 17px var(--f-display);margin:0 0 8px;display:flex;gap:8px;align-items:baseline}
.month h3 span{font:500 12px var(--f-mono);color:var(--muted)}
.rmrow{display:grid;grid-template-columns:52px 1fr;gap:10px;align-items:start;padding:8px 0;border:0;border-bottom:1px solid var(--line);width:100%;text-align:left;background:none;font-size:14px}
.rmrow .d{font:600 12px var(--f-mono);color:var(--muted)}
.rmrow.done{opacity:.55}.rmrow.done .t{text-decoration:line-through}
.rmrow.late .d{color:var(--bad)}
.rmrow .who{display:block;font-size:12px;color:var(--muted)}
.rmfilters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}

.cl2{display:block;font:600 11px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:4px 0 6px}

<script>
(function(){
const ENGINES={writing:"Writing & Intellectual Output",professional:"Professional Technology",education:"Education",heritage:"Digital Heritage & Virtual Worlds",creative:"Media, Creative & Entertainment IP",intelligence:"Intelligence & Research",programmes:"Community, Distribution & Events"};
const DOMAINS={learn:["Learn","Education, community and events that grow people"],work:["Work","Tools and services for built-environment professionals"],heal:["Heal","Health products for professionals and patients"],remember:["Remember","Heritage worlds that keep African history visitable"],imagine:["Imagine","Stories, media and visual IP"],spine:["Spine","The method, the voice, the distribution and the execution system under everything"],unplaced:["Unplaced","No honest connection yet"]};
const DECISIONS=["Build","Finish","Maintain","Delegate","Park","Kill"];
const PRIORITIES=["P1","P2","P3","P4","PX"];
const REVENUE=["none","experimental","active","recurring"];
const MATS=["M0","M1","M2","M3","M4","M5","M6","M7","M1/M2","M2/M3","M3/M4","M4/M5","M4/M6","M5/M6","M4/M7"];
const MAT_NAMES=["Thought","Concept","Specification","Prototype","Working Product","Live Product","Monetized Product","Operating Business"];
const QUESTIONS=["What made money this week?","What product moved materially closer to completion?","Which project has been forgotten for too long?","What external deadline is approaching?","What project can be finished with less than a week of concentrated work?","Which project is consuming attention without evidence of value?","What can be delegated to AI or another person?","What should be deliberately parked?"];

let db=null, canWrite=true, downloads=null;
let projects={}, settings={forgottenDays:30,nextId:51}, loaded=false;
let view="all", tab="focus", editing=null, reviewWeek=weekId(new Date()), reviewDoc={}, reviewUnsub=null;
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const todayISO=()=>{const d=new Date();return new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
function weekId(d){const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));const day=t.getUTCDay()||7;t.setUTCDate(t.getUTCDate()+4-day);const y=new Date(Date.UTC(t.getUTCFullYear(),0,1));return t.getUTCFullYear()+"-W"+String(Math.ceil(((t-y)/864e5+1)/7)).padStart(2,"0")}
function matRange(m){const n=(String(m).match(/\d/g)||["0"]).map(Number);return [n[0],n[n.length-1]]}
function daysSince(iso){if(!iso)return Infinity;return Math.floor((Date.now()-new Date(iso+"T12:00:00").getTime())/864e5)}
function daysUntil(iso){if(!iso)return null;return Math.ceil((new Date(iso+"T12:00:00").getTime()-Date.now())/864e5)}
function toast(msg){const t=$("#toast");t.textContent=msg;t.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>t.hidden=true,2200)}

/* milestones */
function ms(p){return Array.isArray(p.milestones)?p.milestones:[]}
function nextMs(p){return ms(p).filter(m=>!m.done&&m.due).sort((a,b)=>a.due.localeCompare(b.due))[0]||null}
function overdueMs(p){return ms(p).filter(m=>!m.done&&m.due&&daysUntil(m.due)<0)}
function fmtDate(iso){if(!iso)return "";const d=new Date(iso+"T12:00:00");return d.toLocaleDateString(undefined,{day:"numeric",month:"short",year:d.getFullYear()!==new Date().getFullYear()?"numeric":undefined})}
function dueText(iso){const d=daysUntil(iso);return d<0?`${Math.abs(d)}d overdue`:d===0?"due today":d===1?"due tomorrow":d<=60?`due in ${d}d`:`due ${fmtDate(iso)}`}
function active(p){return p.priority!=="PX"&&!["Park","Kill"].includes(p.decision)}
function incoming(id){const out=[];list().forEach(h=>(h.helps||[]).forEach(x=>{if(x.to===id&&h.priority!=="PX")out.push({from:h,what:x.what})}));return out}
function addDays(iso,n){const d=new Date(iso+"T12:00:00");d.setDate(d.getDate()+n);return new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)}
function helpTitle(target,what){return `Help ${target.name}: ${what}`}
function helpScheduled(helper,target,what){return ms(helper).some(m=>m.t===helpTitle(target,what))}
function score(p){
  const [lo,hi]=matRange(p.maturity);const parts=[];
  parts.push(["Revenue potential",(p.money||1)*3]);
  parts.push(["Existing momentum (maturity)",Math.round((lo+hi))]);
  parts.push(["Priority",{P1:15,P2:8,P3:3,P4:0,PX:-25}[p.priority]??0]);
  parts.push(["Live revenue",{recurring:12,active:10,experimental:5,none:0}[p.revenue]||0]);
  parts.push(["Strategic value",(p.strategic||2)*4]);
  const du=daysUntil(p.deadline);
  parts.push(["External deadline",du==null?0:du<0?6:du<=30?14:du<=90?9:du<=180?4:1]);

/* activity log: every change is diffed and recorded per week */
const PROGRESS_FIELDS=["maturity","revenue","milestone","next","exists","remains","weekDone"];
const DETAIL_FIELDS={name:"name",category:"category",purpose:"purpose",exists:"what exists",remains:"what remains",routes:"monetization routes",notes:"notes",state:"current state",engine:"engine",whatItIs:"what it is",supposedTo:"what it is supposed to do",nearFuture:"near-future trajectory",longTerm:"long-term destination",character:"current character",strategic:"strategic value",effort:"execution cost"};
const clip=(s,n=140)=>{s=String(s||"").replace(/\s+/g," ").trim();return s.length>n?s.slice(0,n-1)+"…":s};
function diffEvents(old,p){
  const t=new Date().toISOString(),E=[];
  const add=(kind,o={})=>E.push({t,id:p.id,name:clip(p.name,80),kind,...o});
  if(!old){add("created",{to:p.maturity});return E}
  if(p.priority==="PX"&&old.priority!=="PX"){add("archived");return E}
  if(old.priority==="PX"&&p.priority!=="PX")add("restored");
  if(old.maturity!==p.maturity){const a=matRange(old.maturity),b=matRange(p.maturity);add(b[1]>a[1]||(b[1]===a[1]&&b[0]>a[0])?"maturity_up":"maturity_down",{from:old.maturity,to:p.maturity})}
  if(old.revenue!==p.revenue)add("revenue",{from:old.revenue,to:p.revenue});
  if(old.money!==p.money)add("money",{from:old.money,to:p.money});
  if(old.priority!==p.priority&&p.priority!=="PX")add("priority",{from:old.priority,to:p.priority});
  if(old.decision!==p.decision&&p.priority!=="PX")add("decision",{from:old.decision,to:p.decision});
  if((old.milestone||"")!==(p.milestone||"")&&p.milestone)add("milestone",{text:clip(p.milestone)});
  if((old.next||"")!==(p.next||"")&&old.next)add("next_changed",{from:clip(old.next),text:clip(p.next)});

function generateReview(wk){

  ev.filter(e=>e.kind==="deadline"&&e.to).forEach(e=>{if(!q4.some(x=>x.id===e.id))q4.push(it(e.id,`${e.name}: deadline set to ${e.to} this week`))});

async function writePiece(old,w){
  if(!db){toast("Sign in to save changes.");return false}
  try{await db.doc("writing/"+w.id).set(w);writing[w.id]=w}catch(e){toast("Could not save. Check your connection and try again.");return false}
  const t=new Date().toISOString(),ev=[],nm=clip(w.title,80),oldPosts=(old&&old.posts)||[];
  if(!old)ev.push({t,id:w.id,name:nm,kind:"w_idea",text:w.series||w.theme||""});
  (w.posts||[]).filter(p=>!oldPosts.some(o=>o.ch===p.ch&&o.d===p.d)).forEach(p=>ev.push({t,id:w.id,name:nm,kind:"w_published",text:chName(p.ch)}));
  if(old&&old.status!==w.status&&w.status!=="PUBLISHED")ev.push({t,id:w.id,name:nm,kind:"w_status",text:`${old.status} → ${w.status}`});
  if(ev.length)logEvents(ev);
  const n=parseInt(w.id.slice(1),10)+1;
  if(!old&&n>((wmeta&&wmeta.nextW)||0)){const m={...(wmeta||{}),nextW:n};try{await db.doc("meta/writing").set(m);wmeta=m}catch(_){}}
  if(w.relatedProject&&projects[w.relatedProject]&&ev.some(e=>e.kind==="w_published")){const p=projects[w.relatedProject];if(p.lastActivity!==todayISO()){const q={...p,lastActivity:todayISO()};try{await db.doc("projects/"+p.id).set(q);projects[p.id]=q}catch(_){}}}
  return true;
}

/* dictation: a Talk button on text boxes. Uses the phone's speech service when it works,
   otherwise records audio and has Gemini transcribe it. */
const MIC_ICON='<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>';
const SpeechRec=window.SpeechRecognition||window.webkitSpeechRecognition;
let dict=null, srBroken=false;
function micBtn(id){return `<div class="microw"><button type="button" class="micbtn" data-mic="${id}" aria-label="Dictate into this box">${MIC_ICON}<span>Talk</span></button><small class="micmsg" id="micmsg_${id}"></small></div>`}
function micSay(id,t){const m=$("#micmsg_"+id);if(m)m.textContent=t||""}
function micUI(btn,on,label){if(!btn)return;btn.classList.toggle("on",!!on);const s=btn.querySelector("span");if(s)s.textContent=label||(on?"Stop":"Talk")}
async function toggleMic(btn){
  if(dict){const same=dict.btn===btn;stopDict();if(same)return}
  const id=btn.dataset.mic,ta=$("#"+id);if(!ta)return;
  dict={btn,id,ta,base:ta.value.trim()?ta.value.replace(/\s*$/," "):"",keep:true};
  micUI(btn,true,"Stop");micSay(id,"Starting…");
  if(SpeechRec&&!srBroken){startSpeech();return}
  startRecording();
}
function startSpeech(){
  const d=dict;let r;
  try{r=new SpeechRec()}catch(_){srBroken=true;startRecording();return}
  r.lang="en-NG";r.interimResults=true;r.continuous=false;r.maxAlternatives=1;
  let got=false;d.mode="speech";d.rec=r;
  r.onstart=()=>micSay(d.id,"Listening… speak now. Tap Stop when you finish.");
  r.onresult=e=>{let fin="",tmp="";for(let i=0;i<e.results.length;i++){const t=e.results[i][0].transcript;if(e.results[i].isFinal)fin+=t;else tmp+=t}got=true;d.ta.value=(d.base+fin+tmp);if(fin){d.base=(d.base+fin).replace(/\s*$/," ")}};
  r.onerror=e=>{
    if(e.error==="no-speech"||e.error==="aborted")return;
    if(e.error==="not-allowed"&&!got){micSay(d.id,"Microphone blocked. Allow the microphone for this site in your browser settings, then try again.");d.keep=false;stopDict();return}
    srBroken=true;d.keep=false;try{r.abort()}catch(_){}
    if(dict===d){dict.rec=null;startRecording()}
  };
  r.onend=()=>{if(dict===d&&d.keep&&d.mode==="speech"){try{r.start()}catch(_){stopDict()}}};
  try{r.start()}catch(_){srBroken=true;startRecording()}
}
async function startRecording(){
  const d=dict;if(!d)return;
  if(!navigator.mediaDevices||!window.MediaRecorder){micSay(d.id,"This browser can't record. Type instead, or use your keyboard's voice typing.");stopDict();return}
  if(!(window.ccHasKey&&window.ccHasKey())){micSay(d.id,"Add your Gemini key in Map → Voice update AI so recordings can be turned into text.");stopDict();return}
  let stream;
  try{stream=await navigator.mediaDevices.getUserMedia({audio:true})}catch(_){micSay(d.id,"Microphone blocked. Allow the microphone for this site in your browser settings, then try again.");stopDict();return}
  if(dict!==d){stream.getTracks().forEach(t=>t.stop());return}
  const mr=new MediaRecorder(stream);d.mode="record";d.stream=stream;d.chunks=[];d.rec=mr;d.t0=Date.now();
  mr.ondataavailable=e=>{if(e.data&&e.data.size)d.chunks.push(e.data)};
  mr.onstop=()=>transcribeRecording(d);
  mr.start(1000);micSay(d.id,"Recording… tap Stop when you finish.");
  d.timer=setInterval(()=>{const s=Math.round((Date.now()-d.t0)/1000);micSay(d.id,`Recording ${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}… tap Stop when you finish.`);if(s>=600)stopDict()},1000);
}
function stopDict(){
  const d=dict;if(!d)return;dict=null;d.keep=false;
  if(d.timer)clearInterval(d.timer);
  if(d.mode==="speech"){try{d.rec&&d.rec.stop()}catch(_){};micUI(d.btn,false);micSay(d.id,d.ta.value.trim()?"Done. Check the text, then carry on.":"Nothing heard. Tap Talk and try again.");d.ta.dispatchEvent(new Event("input",{bubbles:true}));return}
  if(d.mode==="record"&&d.rec&&d.rec.state!=="inactive"){micUI(d.btn,true,"Working…");micSay(d.id,"Turning your recording into text…");d.rec.stop();return}
  micUI(d.btn,false);
}
async function transcribeRecording(d){
  try{d.stream.getTracks().forEach(t=>t.stop())}catch(_){}
  try{
    const blob=new Blob(d.chunks,{type:(d.rec&&d.rec.mimeType)||"audio/webm"});
    if(blob.size<2000)throw {code:"empty"};
    const text=await window.ccAI.transcribe(blob);
    d.ta.value=(d.base+text).trim();d.ta.dispatchEvent(new Event("input",{bubbles:true}));
    micSay(d.id,"Done. Check the text, then carry on.");
  }catch(e){micSay(d.id,e&&e.code==="empty"?"Nothing recorded. Tap Talk and try again.":e&&e.code==="rate_limited"?"Free Gemini limit reached for now. Try again in a minute.":"Couldn't turn the recording into text. Try again.")}
  finally{micUI(d.btn,false)}
}

document.addEventListener("keydown",e=>{if(e.key!=="Escape")return;if(!$("#celeRoot").hidden){$("#celeRoot").hidden=true;return}if(!$("#lRoot").hidden){closeLog();return}if(!$("#wRoot").hidden){closePiece();return}if(!$("#updRoot").hidden)closeUpdate();else if(!$("#drawerRoot").hidden)closeDrawer()});
$("#updScrim").onclick=closeUpdate;$("#wScrim").onclick=closePiece;$("#lScrim").onclick=closeLog;
document.addEventListener("paste",e=>{if($("#updRoot").hidden||upd.stage!=="compose")return;const imgs=[...(e.clipboardData?.files||[])].filter(f=>f.type.startsWith("image/"));if(imgs.length){e.preventDefault();addFiles(imgs)}});
function setTab(k){tab=k;document.querySelectorAll("[data-tab]").forEach(b=>b.setAttribute("aria-selected",b.dataset.tab===k));["focus","register","roadmap","writing","wins","review","rules"].forEach(x=>$("#tab-"+x).hidden=x!==k);
  if(k==="focus")renderFocus();if(k==="writing")renderWriting();if(k==="roadmap")renderRoadmap();if(k==="review")subscribeReview();if(k==="wins")renderWins();if(k==="rules")renderRules();window.scrollTo(0,0)}
const h=(location.hash||"").slice(1);if(["register","roadmap","writing","wins","review","rules"].includes(h))setTab(h);

/* wins: progress and celebration, built from the activity log */
let winsMeta=null, winsCtl=null, winForm=false, allActLoaded=false; let winsAllProj=false;
const WIN_KINDS=["milestone_done","maturity_up","revenue","outcome_done","w_published","win"];
function matLabel(m){const hi=matRange(m)[1];return `${m} ${MAT_NAMES[hi]||""}`.trim()}
function winOf(e){
  switch(e.kind){
    case "milestone_done":return e.last?{size:"big",title:"Every milestone done",line:`${e.name}: all milestones finished, the last was "${e.text}"`}:{size:"small",title:"Milestone done",line:`${e.name}: ${e.text}`};
    case "maturity_up":return {size:"big",title:"Moved up a stage",line:`${e.name} moved up to ${matLabel(e.to)}`};
    case "revenue":{const r=["none","experimental","active","recurring"],a=r.indexOf(e.from),b=r.indexOf(e.to);if(b<=a)return null;return b>=2?{size:"big",title:"Money coming in",line:`${e.name} is now earning (${e.to})`}:{size:"small",title:"First money test",line:`${e.name} started testing revenue`}}
    case "outcome_done":return {size:"small",title:"Weekly outcome done",line:`${e.name}${e.text?": "+e.text:""}`};
    case "w_published":return {size:"small",title:"Posted",line:`${e.name} ${e.text?"on "+e.text:""}`.trim()};
    case "win":return {size:e.size==="big"?"big":"small",title:e.size==="big"?"Big win":"Win",line:e.name?`${e.name}: ${e.text}`:e.text};
  }
  return null;
}
function allWins(){
  const out=[],seen=new Set();
  Object.keys(activity).forEach(wk=>(activity[wk]||[]).forEach(e=>{
    if(!WIN_KINDS.includes(e.kind))return;const w=winOf(e);if(!w)return;
    const k=[e.id,e.kind,e.text,e.to,String(e.t).slice(0,10)].join("|");if(seen.has(k))return;seen.add(k);
    out.push({...w,e,wk,t:e.t,d:String(e.t).slice(0,10)});
  }));
  return out.sort((a,b)=>String(b.t).localeCompare(String(a.t)));
}
function winsIn(W,wk){return W.filter(w=>w.wk===wk)}
function winStreak(W){let n=0,d=new Date();const has=new Set(W.map(w=>w.wk));if(!has.has(weekId(d)))d.setDate(d.getDate()-7);for(let i=0;i<104;i++){if(has.has(weekId(d))){n++;d.setDate(d.getDate()-7)}else break}return n}
function winsSummary(){
  const W=allWins(),wk=weekId(new Date()),mon=todayISO().slice(0,7);
  return {W,week:winsIn(W,wk),month:W.filter(w=>w.d.slice(0,7)===mon),big:W.filter(w=>w.size==="big"),streak:winStreak(W)};
}
/* celebrate the moment it happens */
const CHEER_S=["Ticked off.","One more down.","Progress you can point to.","That counts.","Keep that pace."];
const CHEER_B=["Big win.","That's a real step up.","Mark this one.","This is what the plan was for."];
function celebrateFrom(evts){
  const wins=evts.map(e=>winOf(e)).filter(Boolean);if(!wins.length)return;
  const big=wins.find(w=>w.size==="big");
  const wkN=winsIn(allWins(),weekId(new Date())).length+wins.length;
  if(big)celebrate(big,wkN,wins.length);else celebrateSmall(wins[0],wkN,wins.length);
}
function confetti(n){
  if(window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  const box=document.createElement("div");box.className="confetti";box.setAttribute("aria-hidden","true");
  const C=["var(--good)","var(--laterite)","var(--indigo)","var(--warn)"];
  for(let i=0;i<n;i++){const s=document.createElement("i");s.style.left=(Math.random()*100)+"%";s.style.background=C[i%C.length];s.style.animationDelay=(Math.random()*.5)+"s";s.style.animationDuration=(1.6+Math.random()*1.4)+"s";s.style.transform=`rotate(${Math.random()*360}deg)`;box.appendChild(s)}
  document.body.appendChild(box);setTimeout(()=>box.remove(),3600);
}
function celebrateSmall(w,wkN,n){
  const t=$("#cheer");t.innerHTML=`<b>${esc(CHEER_S[Math.floor(Math.random()*CHEER_S.length)])}</b> ${esc(w.line)}<small>${n>1?n+" wins just now · ":""}Win ${wkN} this week</small>`;
  t.hidden=false;clearTimeout(celebrateSmall._t);celebrateSmall._t=setTimeout(()=>t.hidden=true,4200);confetti(18);
}
function celebrate(w,wkN,n){
  $("#celeTitle").textContent=CHEER_B[Math.floor(Math.random()*CHEER_B.length)];
  $("#celeKind").textContent=w.title;$("#celeLine").textContent=w.line;
  $("#celeSub").textContent=`${n>1?n+" wins in this update. ":""}Win ${wkN} this week.`;
  $("#celeRoot").hidden=false;confetti(70);setTimeout(()=>$("#celeOk")?.focus(),50);
}
/* load every week's log once, so the wins history is complete */
async function loadAllActivity(){
  if(!db||allActLoaded)return;allActLoaded=true;
  try{const s=await db.collection("activity").limit(500).get();const cur=weekId(new Date());s.docs.forEach(d=>{if(d.exists&&(d.id!==cur||!activity[cur]))activity[d.id]=d.data().events||[]})}catch(_){}
  try{const m=await db.doc("meta/wins").get();winsMeta=m.exists?m.data():{}}catch(_){winsMeta={}}
  render();
}
function winRow(w){return `<button class="winrow ${w.size}"${w.e.id?` data-open="${esc(w.e.id)}"`:""}><span class="wdot" aria-hidden="true">${w.size==="big"?"★":"●"}</span><span><b>${esc(w.title)}</b> ${esc(w.line)}</span><span class="lt">${esc(fmtDate(w.d))}</span></button>`}
function winsFocusHTML(S){
  const recent=S.W.filter(w=>daysSince(w.d)<=7).slice(0,4);
  if(recent.length)return `<div class="panel winpanel"><h2>Recent wins</h2><p class="sub">${S.week.length} this week${S.streak>1?` · ${S.streak}-week streak`:""}. Keep the run going.</p><div class="winlist">${recent.map(winRow).join("")}</div><div class="quick" style="margin-top:10px"><button class="btn" data-tabgo="wins">All wins</button></div></div>`;
  const nm=list().filter(active).map(p=>({p,m:nextMs(p)})).filter(x=>x.m&&x.m.due).sort((a,b)=>a.m.due.localeCompare(b.m.due))[0];
  return `<div class="panel winpanel"><h2>Wins</h2><p class="sub">No wins logged in the last seven days.${nm?` The closest one within reach: <b>${esc(nm.m.t)}</b> on ${esc(nm.p.name)}, ${esc(dueText(nm.m.due))}.`:""}</p><div class="quick" style="margin-top:10px"><button class="btn" data-winlog="1">Log a win</button><button class="btn" data-tabgo="wins">Open wins</button></div></div>`;
}
function winsReviewHTML(wk){
  const W=winsIn(allWins(),wk);if(!W.length)return "";
  const b=W.filter(w=>w.size==="big").length;
  return `<section class="qblock"><h3>Wins this week · ${W.length}${b?` (${b} big)`:""}</h3><div class="winlist">${W.map(winRow).join("")}</div></section>`;
}
function renderWins(){
  const el=$("#tab-wins");if(!el)return;
  if(!loaded){el.innerHTML=`<div class="empty">Loading.</div>`;return}
  if(!allActLoaded)loadAllActivity();
  const S=winsSummary();
  // weekly bars, last 12 weeks
  const weeks=[];const d=new Date();for(let i=11;i>=0;i--){const x=new Date(d);x.setDate(x.getDate()-7*i);weeks.push(weekId(x))}
  const counts=weeks.map(wk=>{const W=winsIn(S.W,wk);return {wk,s:W.filter(w=>w.size==="small").length,b:W.filter(w=>w.size==="big").length}});
  const max=Math.max(3,...counts.map(c=>c.s+c.b));
  // per-project progress
  const Pall=list().filter(p=>active(p)&&ms(p).length),P=Pall.filter(p=>winsAllProj||["P1","P2"].includes(p.priority)).map(p=>{const M=ms(p),dn=M.filter(m=>m.done).length;return {p,dn,n:M.length,pct:Math.round(100*dn/M.length),hi:matRange(p.maturity)[1]}}).sort((a,b)=>({P1:0,P2:1,P3:2,P4:3}[a.p.priority]??4)-({P1:0,P2:1,P3:2,P4:3}[b.p.priority]??4)||b.pct-a.pct);
  const totDone=Pall.reduce((s,p)=>s+ms(p).filter(m=>m.done).length,0),tot=Pall.reduce((s,p)=>s+ms(p).length,0);
  const byMonth={};S.W.forEach(w=>{const k=new Date(w.d+"T12:00:00").toLocaleDateString(undefined,{month:"long",year:"numeric"});(byMonth[k]=byMonth[k]||[]).push(w)});
  const story=winsMeta&&winsMeta.story;
  el.innerHTML=`<div class="hero"><small>Wins and progress</small><h2>${S.W.length?`${S.W.length} win${S.W.length>1?"s":""} logged so far. ${S.week.length?`${S.week.length} this week.`:"None yet this week."}`:"Your first win is one tick away."}</h2>
    <p>Milestones, stage moves, money, weekly outcomes and posts are counted as you go. Log anything the app can't see.</p>
    <div class="pulse">
      <button class="${S.week.length?"good":""}" data-jump="wTimeline"><b>${S.week.length}</b><span>This week</span></button>
      <button data-jump="wTimeline"><b>${S.month.length}</b><span>This month</span></button>
      <button class="${S.big.length?"good":""}" data-jump="wTrophy"><b>${S.big.length}</b><span>Big wins</span></button>
      <button class="${S.streak>1?"good":""}" data-jump="wChart"><b>${S.streak}</b><span>Week streak</span></button>
      <button data-jump="wProj"><b>${totDone}/${tot}</b><span>Milestones done</span></button>
    </div>
    <div class="quick" style="margin-top:14px"><button class="btn primary" data-winlog="1">Log a win</button><button class="btn" id="winStory">How far have I come?</button></div></div>
  ${winForm?`<div class="panel" id="winFormP"><h2>Log a win</h2><p class="sub">For wins the app can't see: a client said yes, a talk went well, a payment landed, a hard conversation finally happened.</p>
    <div class="f"><label for="wn_text">What happened</label><textarea id="wn_text" rows="2" placeholder="e.g. Signed the first studio client for 2027"></textarea></div>
    <div class="fs"><div class="f"><label for="wn_proj">Project (optional)</label><select id="wn_proj"><option value="">None</option>${list().filter(p=>p.priority!=="PX").sort((a,b)=>a.id.localeCompare(b.id)).map(p=>`<option value="${esc(p.id)}">${esc(p.id)} · ${esc(p.name)}</option>`).join("")}</select></div>
    <div class="f"><label for="wn_size">Size</label><select id="wn_size"><option value="small">Small win</option><option value="big">Big win</option></select></div></div>
    <div class="quick"><button class="btn primary" id="wn_save">Save and celebrate</button><button class="btn" id="wn_cancel">Cancel</button></div></div>`:""}
  ${story||winsCtl?`<div class="panel" id="wStory"><h2>How far you've come</h2>${winsCtl?`<p class="sub"><span class="dots"><i></i><i></i><i></i></span> Writing it up from your log.</p>`:`<div class="story">${story.split(/\n+/).map(x=>`<p>${esc(x)}</p>`).join("")}</div><p class="sub">Written ${esc(fmtDate(String(winsMeta.at||"").slice(0,10)))}. Tap the button above for a fresh one.</p>`}</div>`:""}
  <div class="panel" id="wChart"><h2>Wins per week</h2><p class="sub">The last twelve weeks. Dark is big wins.</p>
    <div class="bars">${counts.map(c=>`<div class="barcol" title="${esc(c.wk)}: ${c.s+c.b} wins"><div class="wbar"><i class="bb" style="height:${100*c.b/max}%"></i><i class="bs" style="height:${100*c.s/max}%"></i></div><b>${c.s+c.b||""}</b><small>${esc(c.wk.slice(-3))}</small></div>`).join("")}</div></div>
  <div class="panel" id="wTrophy"><h2>Big wins</h2><p class="sub">Stage moves, money coming in, finished milestone sets, and the big ones you log.</p>${S.big.length?`<div class="winlist">${S.big.map(winRow).join("")}</div>`:`<p class="sub">None yet. The next stage move on any P1 lands here.</p>`}</div>
  <div class="panel" id="wProj"><h2>Progress by project</h2><p class="sub">Milestones done against the plan, and where each project sits on the M0 to M7 ladder. ${winsAllProj?"All active projects.":"P1 and P2 projects."} <button class="btn" data-winsall="1" style="margin-left:6px">${winsAllProj?"Show P1 and P2 only":"Show all "+Pall.length}</button></p>
    <div class="plist">${P.map(x=>`<button class="prow" data-open="${esc(x.p.id)}"><span class="pn"><b>${esc(x.p.name)}</b><small>${esc(x.p.id)} · ${esc(x.p.priority)} · ${esc(matLabel(x.p.maturity))}</small></span><span class="pbar" aria-label="${x.dn} of ${x.n} milestones done"><i style="width:${x.pct}%"></i></span><span class="pc">${x.dn}/${x.n}</span><span class="ladder" aria-hidden="true">${MAT_NAMES.map((_,i)=>`<i class="${i<=x.hi?"on":""}"></i>`).join("")}</span></button>`).join("")}</div></div>
  <div class="panel" id="wTimeline"><h2>Every win</h2><p class="sub">Newest first. Tap one to open the project.</p>${S.W.length?Object.entries(byMonth).map(([m,ws])=>`<div class="day"><h4>${esc(m)} · ${ws.length}</h4><div class="winlist">${ws.map(winRow).join("")}</div></div>`).join(""):`<p class="sub">Nothing yet. Tick a milestone, finish a weekly outcome or log a post and it appears here.</p>`}</div>`;
}
async function saveWin(){
  const text=($("#wn_text").value||"").trim();if(!text){$("#wn_text").focus();return}
  const id=$("#wn_proj").value,size=$("#wn_size").value,p=projects[id];
  const e={t:new Date().toISOString(),id:id||"",name:p?clip(p.name,80):"",kind:"win",text:clip(text,200),size};
  if(p&&p.lastActivity!==todayISO()){const q={...p,lastActivity:todayISO(),log:[{d:todayISO(),t:e.t,summary:"Win: "+clip(text,380),source:"win"},...(p.log||[])].slice(0,40)};try{await db.doc("projects/"+p.id).set(q);projects[p.id]=q}catch(_){}}
  winForm=false;logEvents([e]);renderWins();
}
function winsPrompt(S){
  const W=S.W.slice(0,80).map(w=>`${w.d} [${w.size}] ${w.title}: ${w.line}`).join("\n");
  const P=list().filter(p=>active(p)&&["P1","P2"].includes(p.priority)).map(p=>`${p.name} - ${p.maturity}, ${ms(p).filter(m=>m.done).length}/${ms(p).length} milestones done, revenue ${p.revenue||"none"}`).join("\n");
  return `You are writing a short progress note for Prof Newrock (Arc), an architect and founder of BuildNET in Ibadan, Nigeria, who runs many projects at once. He wants to see how far he has come so the work never feels blank.

Today is ${todayISO()}. The log began on 5 October 2026.

Wins logged (newest first):
${W||"(none yet)"}

Where his main projects stand:
${P}

Write 3 short paragraphs, speaking to him as "you":
1. What he has actually achieved, naming the specific wins and the biggest ones first.
2. The pattern: which parts of the portfolio are moving and how they help each other.
3. The single next win that is closest, and why it matters.
Be warm and specific. Use only the facts above. No hype, no exclamation marks. Use hyphens, never em dashes. Do not use the phrase "not X but Y" or the words "room" or "dangerous". If there are few wins, say so kindly and point to the closest one.
Reply with only JSON: {"story":"paragraph one\\n\\nparagraph two\\n\\nparagraph three"}`;
}
async function writeStory(){
  if(!sample||!(window.ccHasKey&&window.ccHasKey())){toast("Add your Gemini key in Map → Voice update AI first.");return}
  if(winsCtl)return;winsCtl=new AbortController();renderWins();document.getElementById("wStory")?.scrollIntoView({behavior:"smooth",block:"start"});
  try{
    if(!allActLoaded)await loadAllActivity();
    const r=await sample.json(winsPrompt(winsSummary()),{signal:winsCtl.signal,cache:false});
    const story=String(r&&r.story||"").replace(/[—–]/g,"-").trim();if(!story)throw {code:"empty"};
    winsMeta={...(winsMeta||{}),story,at:new Date().toISOString()};try{await db.doc("meta/wins").set(winsMeta)}catch(_){}
  }catch(e){const c=e&&e.code;if(c!=="cancelled")toast(c==="bad_key"?"The Gemini key was rejected. Check it in Map → Voice update AI.":c==="rate_limited"?"You've hit the AI usage limit for now. Try again later.":"Couldn't write it just now. Try again.")}
  finally{winsCtl=null;renderWins()}
}

render();

/* data */
(async()=>{
  if(!window.claude||!window.claude.use){loaded=true;showStatus("Sign in to load your saved projects.");render();return}
  db=await window.claude.use("db");
  const user=await window.claude.use("user");
  downloads=await window.claude.use("downloads");
  window.claude.use("sample").then(async sm=>{sample=sm;if(sm){try{const l=await sm.limits();imgLimits=l&&l.images||null}catch(_){imgLimits=null}}if(!$("#updRoot").hidden&&upd.stage==="compose")renderUpdate()});
  window.claude.use("assets").then(a=>{assets=a});
  if(downloads)$("#exportBtn").hidden=false;
  if(!db){loaded=true;showStatus("Sign in to load and edit the register.");render();return}
  if(user){try{const c=await user.can("data.write");if(c===false){canWrite=false;$("#addBtn").hidden=true;showStatus("View-only: you can browse the register but not change it.")}}catch(_){}}
  const wk=weekId(new Date());let gotSettings=false,gotProjects=false,rolled=false;
  const maybeRoll=async()=>{
    if(rolled||!gotSettings||!gotProjects)return;rolled=true;
    if(settings.weekOf===wk)return;
    // new week: finished outcomes leave the five, unfinished ones carry over
    if(settings.weekOf){for(const p of list().filter(x=>x.week&&x.weekDone)){const q={...p,week:false,weekDone:false,weekOutcome:""};try{await db.doc("projects/"+p.id).set(q);projects[p.id]=q}catch(_){}}}
    settings={...settings,weekOf:wk};try{await db.doc("meta/settings").set(settings)}catch(_){}
    render();
  };
  db.doc("meta/settings").onSnapshot(s=>{if(s.exists)settings={forgottenDays:30,nextId:51,...s.data()};gotSettings=true;maybeRoll();render()},()=>{gotSettings=true});
  db.doc("activity/"+wk).onSnapshot(s=>{if(s.metadata.hasPendingWrites)return;activity[wk]=s.exists?(s.data().events||[]):[];render()},()=>{});
  db.doc("reviews/"+wk).get().then(r=>{storedReview[wk]=r.exists?{...r.data()}:{};scheduleGen()}).catch(()=>{});
  loadAllActivity();
  db.collection("writing").onSnapshot(snap=>{const n={};snap.docs.forEach(d=>{if(d.exists)n[d.id]={...d.data(),id:d.id}});writing=n;render()},()=>{});
  db.doc("meta/writing").onSnapshot(s=>{wmeta=s.exists?{...s.data()}:null;render()},()=>{});
  db.collection("projects").onSnapshot(snap=>{
    const next={};snap.docs.forEach(d=>{if(d.exists)next[d.id]={...d.data(),id:d.id}});
    projects=next;loaded=true;gotProjects=true;maybeRoll();render();scheduleGen();
  },err=>{loaded=true;showStatus(err&&err.code==="revoked"?"Access to this register changed. Reload to continue.":"Could not load the register. Reload the page to try again.");render()});
})();
function showStatus(m){const s=$("#status");s.textContent=m;s.hidden=false}
})();
</script>
